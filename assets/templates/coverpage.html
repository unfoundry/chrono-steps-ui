<section class="cover-page">
  <div class="cover-top-accent"></div>
  <div class="cover-brand-row">
    <span class="cover-logo">CS</span>
    <span class="cover-brand-name">{{BRANDING}}</span>
  </div>
  <div class="cover-body">
    <span class="cover-kicker">Standard Operating Procedure</span>
    <h1 class="cover-title">{{PROJECT_NAME}}</h1>
    <p class="cover-author">Prepared by <strong>{{AUTHOR}}</strong></p>
    <div class="cover-stats">
      <div class="cover-stat">
        <b>{{STEP_COUNT}}</b>
        <span>Total Steps</span>
      </div>
      <div class="cover-stat">
        <b>{{SCREENSHOT_COUNT}}</b>
        <span>Screenshots</span>
      </div>
      <div class="cover-stat">
        <b>{{GENERATED_AT}}</b>
        <span>Generated</span>
      </div>
    </div>
  </div>
  <div class="cover-footer">
    <span>{{BRANDING}}</span>
    <span>Generated {{GENERATED_AT}}</span>
  </div>
</section>
