<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml" />
  <title>Chrono Steps — Procedure Viewer</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/vendor/sweetalert2/sweetalert2.min.css" />
  <link rel="stylesheet" href="assets/view.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Top Ribbon Header -->
  <header class="ribbon-header">
    <div class="ribbon-bar">
      <div class="d-flex align-items-center gap-2 flex-wrap min-w-0">
        <a href="../index.html" class="ribbon-brand" title="Open Chrono Steps Studio">
          <span class="ribbon-brand-icon"><i class="bi bi-camera-reels"></i></span>
          <span>Chrono Steps</span>
          <span class="badge rounded-pill text-bg-light border text-primary fw-semibold" style="font-size:0.7rem;">Viewer</span>
        </a>
        <div class="vr mx-1 text-secondary opacity-25 d-none d-md-block"></div>
        <div class="min-w-0">
          <div class="d-flex align-items-center gap-2">
            <h1 id="viewTitle" class="h6 fw-bold mb-0 text-truncate">Chrono Steps Guide</h1>
            <span id="stepTotal" class="badge rounded-pill text-bg-primary">0 steps</span>
          </div>
          <p id="viewAuthor" class="small text-muted mb-0 text-truncate" style="font-size:0.75rem;"></p>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <div class="form-check form-switch m-0 d-flex align-items-center gap-1 me-1" title="Show/hide visual cues on video">
          <input id="viewCueToggle" class="form-check-input m-0" type="checkbox" checked />
          <label class="form-check-label small fw-semibold text-secondary" for="viewCueToggle">Cues</label>
        </div>
        <div class="btn-group btn-group-sm">
          <button id="printGuide" class="btn btn-outline-danger" type="button" title="Print / Save PDF">
            <i class="bi bi-filetype-pdf"></i> <span class="d-none d-sm-inline">Print / PDF</span>
          </button>
          <button id="downloadHtml" class="btn btn-primary" type="button" title="Download standalone HTML guide">
            <i class="bi bi-filetype-html"></i> <span class="d-none d-sm-inline">HTML</span>
          </button>
          <button id="downloadLite" class="btn btn-outline-secondary" type="button" title="Download .stepslite">
            <i class="bi bi-file-earmark-zip"></i> <span class="d-none d-md-inline">StepsLite</span>
          </button>
          <a id="openFullPage" class="btn btn-outline-secondary" target="_blank" rel="noopener noreferrer" title="Open full page">
            <i class="bi bi-box-arrow-up-right"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="viewer" class="viewer container-fluid p-2 p-md-3" aria-busy="true">
    <section id="videoRegion" class="video-region glass-panel overflow-hidden" aria-label="Video player">
      <div class="panel-header d-flex justify-content-between align-items-center px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-play-btn text-primary"></i>
          <strong class="small text-uppercase tracking-wide">Procedure Playback</strong>
        </div>
        <span class="small text-muted d-none d-sm-inline">Click any highlighted cue to jump to its step</span>
      </div>

      <div class="media-stage" id="mediaStage">
        <video id="viewVideo" playsinline preload="metadata"></video>
        <canvas id="viewCanvas" aria-hidden="true"></canvas>
        <div id="viewLoading" class="view-loading">
          <div class="spinner-border text-primary"></div>
          <strong class="mt-2">Loading guide</strong>
          <span id="viewStatus" class="small text-muted">Reading project...</span>
        </div>
      </div>

      <div class="player-controls">
        <div class="btn-group btn-group-sm">
          <button id="backFive" class="btn btn-outline-secondary" type="button" title="Back 5s">
            <i class="bi bi-arrow-counterclockwise"></i> 5
          </button>
          <button id="playPause" class="btn btn-primary px-3" type="button" title="Play / Pause">
            <i id="playIcon" class="bi bi-play-fill"></i>
          </button>
          <button id="forwardFive" class="btn btn-outline-secondary" type="button" title="Forward 5s">
            5 <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <span id="currentTime" class="player-time">00:00</span>
        <input id="seekBar" class="form-range flex-grow-1" type="range" min="0" max="1000" value="0" aria-label="Video position" />
        <span id="durationTime" class="player-time">00:00</span>
        <button id="muteButton" class="btn btn-sm btn-outline-secondary" type="button" title="Mute">
          <i class="bi bi-volume-up"></i>
        </button>
      </div>
    </section>

    <div id="layoutDivider" class="layout-divider" role="separator" aria-label="Resize video and steps" tabindex="0">
      <span class="divider-grip"></span>
    </div>

    <aside id="stepsRegion" class="steps-region glass-panel overflow-hidden" aria-label="Guide steps">
      <div class="panel-header d-flex justify-content-between align-items-center px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-list-ol text-primary"></i>
          <strong class="small text-uppercase tracking-wide">Guide Steps</strong>
        </div>
      </div>
      <div id="viewSteps" class="view-steps"></div>
    </aside>

    <div id="viewError" class="alert alert-danger m-3 view-error" role="alert" hidden></div>
  </main>

  <!-- Screenshot Zoom & Pan Modal -->
  <div class="modal fade" id="viewImageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content glass-panel border-0">
        <div class="modal-header border-bottom">
          <h5 id="viewImageTitle" class="modal-title fw-bold">Screenshot</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="btn-group btn-group-sm" role="group" aria-label="Zoom controls">
              <button id="viewZoomOut" type="button" class="btn btn-outline-secondary" title="Zoom out">
                <i class="bi bi-zoom-out"></i> Zoom Out
              </button>
              <button id="viewZoomReset" type="button" class="btn btn-outline-secondary" title="Reset zoom & pan">
                100%
              </button>
              <button id="viewZoomIn" type="button" class="btn btn-outline-secondary" title="Zoom in">
                <i class="bi bi-zoom-in"></i> Zoom In
              </button>
            </div>
            <span class="small text-muted"><i class="bi bi-arrows-move me-1"></i>Drag image to pan · <span id="viewZoomLabel" class="font-monospace">100%</span></span>
          </div>
          <div class="image-zoom-viewport">
            <img id="viewImageImg" alt="Expanded step screenshot" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/export.js"></script>
  <script src="assets/view.js"></script>
</body>

</html>
